<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Your Vote, Your Valentine</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- Header -->
  <header class="topbar">
    <div class="topbar__inner">
      <!-- Left: Signature -->
      <a class="brand" href="#home" aria-label="Home">
        <!-- Replace with your own logo image if you have it -->
         <img src="assets/signature.png" alt="Dave Saputra Signature" class="brand__logo">
      </a>

      <!-- Center crest -->
      <div class="crest" aria-label="Crest">
        <!-- Replace with an <img> if you have the crest -->
        <img src="assets/crest.png" alt="Campaign Crest" class="crest__img">
      </div>

      <!-- Right -->
      <nav class="nav">
        <a class="nav__link" href="#about">
          <img src="assets/us-flag.png" alt="US Flag" class="nav__flag-img">
          <span>About Us</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <main id="home" class="hero" role="main" aria-label="Hero section">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="hero__overlay" aria-hidden="true"></div>

    <section class="hero__content">
      <h1 class="hero__title">Your Vote, Your Valentine.</h1>

      <p class="hero__subtitle">
        In this 14<sup>th</sup> February celebration, we invite every Lydia Thio Fanny
        to vote Dave S. Saputra for a better future!
      </p>

      <div class="hero__actions">
        <button class="btn btn--primary" id="proceedBtn" type="button">
          Proceed
        </button>
      </div>
    </section>
  </main>


  <script src="js/main.js"></script>
</body>
</html>
